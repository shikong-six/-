<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f9d8f">
    <title>法制通</title>
    <style>
        /* 首屏占位：bundle 还在下载时不要给用户一片纯白。
           #app 一旦被 Vue 挂载就不再是空的，这条占位会自动消失 —— 纯 CSS，零 JS。 */
        #app:empty::after{
            content:'正在加载…';
            display:block;
            padding:48px 0;
            text-align:center;
            color:#8a94a6;
            font:14px/1.6 system-ui,-apple-system,"Microsoft YaHei",sans-serif;
        }
    </style>
</head>
<body>
    <div id="app"></div>
</body>
</html>
